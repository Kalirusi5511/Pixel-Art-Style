<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MakeBead — Pixel Art Studio</title>
<style>
:root{--p:#f4d;--d:#2b2320;--l:#e8ddd4;--m:#79675d}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#faf6f2;color:var(--d)}
header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--l);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.b{font-weight:900}nav{display:flex;gap:14px;font:700 11px monospace}
nav a{color:var(--m);text-decoration:none}nav a:hover{color:var(--p)}
.sp{flex:1}.ls{display:flex;gap:5px;align-items:center}
.ls label{font:900 9px monospace;color:var(--m)}select,.hbtn{border:1px solid var(--l);border-radius:6px;padding:6px;font:800 10px monospace;background:#fff}
.hbtn{background:var(--p);color:#fff;border-color:var(--p);cursor:pointer}
main{max-width:1100px;margin:auto;padding:20px}
h1{font-size:20px}h2{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--m);margin:1.2em 0 .4em}
.g{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}@media(max-width:800px){.g{grid-template-columns:1fr}nav{display:none}}
.c{background:#fff;border:1px solid var(--l);border-radius:10px;padding:14px}
#drop{border:2px dashed var(--l);border-radius:10px;padding:30px;text-align:center;cursor:pointer;color:var(--m)}
#drop.h{border-color:var(--p);background:#fff6fa}#drop b{display:block;color:var(--d);margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.t{flex:1;padding:7px;border:1px solid var(--l);background:#fff;border-radius:6px;font:800 10px monospace;cursor:pointer;color:var(--m)}
.t.on{background:var(--d);color:#fff;border-color:var(--d)}
.cv{background:#fff;border:1px solid var(--l);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center;min-height:200px}
canvas{max-width:100%;image-rendering:pixelated}
.cap{font:600 11px monospace;color:var(--m);text-align:center;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
button.a{border:1px solid var(--l);background:#fff;padding:8px 10px;border-radius:6px;font:800 10px monospace;cursor:pointer}
button.a.p{background:var(--p);color:#fff;border-color:var(--p)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.presets button{padding:6px;border:1px solid var(--l);background:#fff;border-radius:6px;font:800 9px monospace;cursor:pointer}
label.r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;font-size:12px}
label.r input[type=range]{flex:1;max-width:130px;accent-color:var(--p)}input[type=checkbox]{accent-color:var(--p)}
.st{font:600 11px monospace;color:var(--m);margin-top:8px}
.hide{display:none}
.mb{position:fixed;inset:0;background:rgba(20,10,15,.55);display:none;z-index:50;padding:16px;overflow:auto}
.mb.on{display:flex;justify-content:center;align-items:flex-start}
.mod{background:#fff;max-width:820px;width:100%;border-radius:12px;overflow:hidden}
.mod header{position:sticky;top:0;background:#fff;z-index:1}
.mod h2{margin:0;font-size:13px;letter-spacing:1px;color:var(--d)}
.mod .x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--m)}
.mbody{padding:16px}#helpList{border-top:1px solid var(--l);margin-top:10px}
.mbody p{color:var(--m);font-size:13px}
.htools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.htools input{flex:1;min-width:150px;padding:8px;border:1px solid var(--l);border-radius:6px}
.htools button{border:1px solid var(--l);background:#fff;padding:7px 9px;border-radius:6px;font:800 10px monospace;cursor:pointer}
#hc{font:800 10px monospace;color:var(--m);align-self:center;margin-left:auto}
details{border:1px solid var(--l);border-radius:8px;margin-bottom:6px;overflow:hidden}
summary{padding:10px;cursor:pointer;font:800 12px monospace;background:#fdfaf7}
summary:hover{background:#fff6fa}
details div{padding:0 12px 10px;color:var(--m);font-size:13px}details div p{margin:6px 0}
#he{color:var(--m);text-align:center;padding:16px;display:none}
footer{text-align:center;color:var(--m);font-size:11px;padding:18px}
</style>
</head>
<body>
<header>
  <span class="b">MakeBead</span>
  <nav>
    <a href="#" data-i="GALLERY"></a><a href="#" data-i="CONVERTERS"></a>
    <a href="#" data-i="DESIGNERS"></a><a href="#help" id="olink"></a><a href="#" data-i="FEEDBACK"></a>
  </nav>
  <span class="sp"></span>
  <div class="ls"><label for="lang" data-i="LANGUAGE"></label>
    <select id="lang"><option value="en">English</option><option value="de">Deutsch</option></select>
  </div>
  <button class="hbtn" id="openHelp" data-i="HELP"></button>
</header>
<main>
  <p style="text-align:center;font:800 11px monospace;letter-spacing:2px;color:var(--m)" data-i="STUDIO"></p>
  <h1 data-i="TITLE"></h1>
  <p style="color:var(--m);max-width:70ch" data-i="LEAD"></p>
  <div class="g">
    <section class="c">
      <div class="tabs">
        <button class="t on" id="tConv" data-i="PC"></button>
        <button class="t" id="tComp" data-i="BA"></button>
      </div>
      <div id="drop" tabindex="0" role="button"><b data-i="DROP"></b><span data-i="FORMATS"></span></div>
      <input type="file" id="fi" accept="image/jpeg,image/png,image/webp" hidden>
      <div class="st" id="st" data-i="PROCESSED"></div>
      <div id="pv" class="hide">
        <div class="cv"><canvas id="pc"></canvas></div>
        <div class="cap" id="cap"></div>
        <div class="row">
          <button class="a" id="chg" data-i="CHANGE"></button>
          <button class="a" id="rst" data-i="RESTORE"></button>
          <button class="a" id="rset" data-i="RESET"></button>
        </div>
        <div class="row">
          <button class="a p" id="dlp" data-i="DLP"></button>
          <button class="a" id="dlo" data-i="DLO"></button>
        </div>
      </div>
      <div id="cv" class="hide">
        <div class="cv"><canvas id="co"></canvas><canvas id="cp"></canvas></div>
        <div class="cap" data-i="BA"></div>
      </div>
    </section>
    <aside class="c">
      <h2 data-i="STYLE"></h2>
      <div class="presets">
        <button data-ps="fine" data-i="FINE"></button><button data-ps="classic" data-i="CLASSIC"></button>
        <button data-ps="chunky" data-i="CHUNKY"></button><button data-ps="sprite" data-i="SPRITE"></button>
      </div>
      <h2 data-i="PSIZE"></h2>
      <label class="r"><span data-i="WIDTH"></span><input type="range" id="ps" min="16" max="256" value="64"><output id="psO">64</output></label>
      <label class="r"><span data-i="SCALE"></span>
        <select id="sm"><option value="sharp" data-i="SHP"></option><option value="smooth" data-i="SMH"></option></select>
      </label>
      <h2 data-i="CLARITY"></h2>
      <label class="r"><span data-i="SHARP"></span><input type="range" id="sh" min="0" max="100" value="25"><output id="shO">25</output></label>
      <label class="r"><span data-i="BLUR"></span><input type="range" id="bl" min="0" max="100" value="0"><output id="blO">0</output></label>
      <h2 data-i="COLOR"></h2>
      <label class="r"><span data-i="CLIM"></span><input type="range" id="cl" min="2" max="64" value="24"><output id="clO">24</output></label>
      <label class="r"><span data-i="CON"></span><input type="range" id="co" min="50" max="150" value="100"><output id="coO">100</output></label>
      <label class="r"><span data-i="SAT"></span><input type="range" id="sa" min="0" max="200" value="100"><output id="saO">100</output></label>
      <label class="r"><span data-i="OUT"></span><input type="checkbox" id="ol"></label>
      <h2 data-i="EXP"></h2>
      <label class="r"><span data-i="SCALE"></span><input type="range" id="es" min="1" max="16" value="6"><output id="esO">6×</output></label>
      <label class="r"><span data-i="GRID"></span><input type="checkbox" id="gr"></label>
    </aside>
  </div>
</main>
<footer data-i="FOOTER"></footer>

<div class="mb" id="mb" role="dialog" aria-modal="true">
  <div class="mod">
    <header>
      <span style="font:800 10px monospace;color:var(--p)" data-i="SUP"></span>
      <h2 data-i="HC"></h2><span class="sp"></span>
      <button class="x" id="xHelp" aria-label="Close">×</button>
    </header>
    <div class="mbody">
      <p data-i="HINTRO"></p>
      <div class="htools">
        <input type="search" id="hs" data-i="HSPH">
        <button id="ea" data-i="EXA"></button><button id="ca" data-i="COA"></button>
        <span id="hc"></span>
      </div>
      <div id="helpList"></div>
      <p id="he"></p>
    </div>
  </div>
</div>

<script>
/* ---------- text + help ---------- */
const T={
en:{GALLERY:'GALLERY',CONVERTERS:'CONVERTERS⌄',DESIGNERS:'DESIGNERS⌄',GUIDES:'GUIDES',FEEDBACK:'FEEDBACK',LANGUAGE:'LANGUAGE',HELP:'HELP CENTER ?',STUDIO:'~ PIXEL ART STUDIO ~',TITLE:'IMAGE TO PIXEL ART CONVERTER',LEAD:'Turn any photo into pixel art. Control pixel size, sharpness, blur, contrast and colors — preview live and export a PNG. Your image stays on your device.',PC:'PIXEL CONVERTER',BA:'BEFORE / AFTER',DROP:'DROP IMAGE OR CLICK TO UPLOAD',FORMATS:'JPEG, PNG, or WebP',PROCESSED:'♙ Processed in your browser — never uploaded',CHANGE:'CHANGE IMAGE',RESTORE:'RESTORE ORIGINAL',RESET:'RESET SETTINGS',DLP:'DOWNLOAD PIXEL ART PNG ↓',DLO:'DOWNLOAD ORIGINAL PNG ↓',STYLE:'PIXEL STYLE',FINE:'FINE PIXELS',CLASSIC:'CLASSIC 8-BIT',CHUNKY:'CHUNKY 16-BIT',SPRITE:'TINY SPRITE',PSIZE:'PIXEL SIZE',WIDTH:'Width',SCALE:'Output scaling',SHP:'Pixelated / sharp edges',SMH:'Smooth / soft edges',CLARITY:'IMAGE CLARITY',SHARP:'Sharpness',BLUR:'Blur / softness',COLOR:'COLOR & DETAIL',CLIM:'Color limit',CON:'Contrast',SAT:'Saturation',OUT:'Add dark pixel outline',EXP:'EXPORT SIZE',GRID:'Show pixel grid in preview',FOOTER:'MakeBead Pixel Art Studio · Your image never leaves your device.',SUP:'~ MAKEBEAD SUPPORT ~',HC:'HELP CENTER',HINTRO:'Everything you need to use the studio. Search guides or open a topic.',EXA:'EXPAND ALL',COA:'COLLAPSE ALL',HSPH:'Search help topics...',EMPTY:'No help topics match your search.',NIMG:'Upload an image first.',BAD:'Please select a JPEG, PNG or WebP image.',FAIL:'Could not open this image.',CAP:'{w} × {h} px grid · {c} colors · {s}× export'},
de:{GALLERY:'GALERIE',CONVERTERS:'KONVERTER⌄',DESIGNERS:'DESIGNER⌄',GUIDES:'ANLEITUNGEN',FEEDBACK:'FEEDBACK',LANGUAGE:'SPRACHE',HELP:'HILFECENTER ?',STUDIO:'~ PIXEL-ART-STUDIO ~',TITLE:'BILD- ZU PIXEL-ART-KONVERTER',LEAD:'Verwandle jedes Foto in Pixel-Art. Steuere Pixelgröße, Schärfe, Unschärfe, Kontrast und Farben – Vorschau live, Export als PNG. Dein Bild bleibt auf deinem Gerät.',PC:'PIXEL-KONVERTER',BA:'VORHER / NACHHER',DROP:'BILD ABLEGEN ODER ZUM HOCHLADEN KLICKEN',FORMATS:'JPEG, PNG oder WebP',PROCESSED:'♙ Verarbeitung im Browser – kein Upload',CHANGE:'BILD ÄNDERN',RESTORE:'ORIGINAL WIEDERHERSTELLEN',RESET:'EINSTELLUNGEN ZURÜCKSETZEN',DLP:'PIXEL-ART-PNG HERUNTERLADEN ↓',DLO:'ORIGINAL-PNG HERUNTERLADEN ↓',STYLE:'PIXEL-STIL',FINE:'FEINE PIXEL',CLASSIC:'KLASSISCH 8-BIT',CHUNKY:'GROBE 16-BIT',SPRITE:'KLEINES SPRITE',PSIZE:'PIXELGRÖSSE',WIDTH:'Breite',SCALE:'Skalierung',SHP:'Pixelig / scharfe Kanten',SMH:'Glatt / weiche Kanten',CLARITY:'BILDKLARHEIT',SHARP:'Schärfe',BLUR:'Unschärfe / Weichheit',COLOR:'FARBE & DETAILS',CLIM:'Farbanzahl',CON:'Kontrast',SAT:'Farbsättigung',OUT:'Dunkle Pixelkontur hinzufügen',EXP:'EXPORTGRÖSSE',GRID:'Pixelraster in der Vorschau anzeigen',FOOTER:'MakeBead Pixel-Art-Studio · Dein Bild verlässt nie dein Gerät.',SUP:'~ MAKEBEAD-SUPPORT ~',HC:'HILFECENTER',HINTRO:'Alles, was du zum Studio brauchst. Suche in den Anleitungen oder öffne ein Thema.',EXA:'ALLE AUFKLAPPEN',COA:'ALLE ZUKLAPPEN',HSPH:'Hilfethemen durchsuchen...',EMPTY:'Keine passenden Hilfethemen gefunden.',NIMG:'Bitte lade zuerst ein Bild hoch.',BAD:'Bitte wähle ein JPEG-, PNG- oder WebP-Bild aus.',FAIL:'Dieses Bild konnte nicht geöffnet werden.',CAP:'{w} × {h} px Raster · {c} Farben · Export {s}×'}};

const H={
en:[
['01 · GETTING STARTED','<p>Upload an image, pick a style, adjust the sliders, compare, then download.</p>'],
['02 · UPLOADING OR CHANGING','<p>Click or drag to upload. Use CHANGE IMAGE to replace it. PNG, JPEG, WebP supported.</p>'],
['03 · FORMATS','<p>Input: PNG, JPEG, WebP. Output: PNG. Animations are not processed as animation.</p>'],
['04 · PRIVACY','<p>All processing happens in your browser. Nothing is uploaded.</p>'],
['05 · PIXEL SIZE','<p>Lower values = bigger blocks. Try 48–96 px for classic sprites.</p>'],
['06 · PRESETS','<p>Fine, Classic, Chunky, Sprite — presets set the sliders; you can still fine-tune.</p>'],
['07 · SCALING','<p>Sharp = nearest-neighbor. Smooth = blended pixels.</p>'],
['08 · SHARPNESS','<p>Boosts edge definition. High values add noise or halos.</p>'],
['09 · BLUR','<p>Applied before downscaling. More blur = softer, less detail.</p>'],
['10 · COLOR LIMIT','<p>Caps the number of colors. Lower = poster-like look.</p>'],
['11 · CONTRAST & SATURATION','<p>Contrast separates dark/light. Saturation controls color intensity.</p>'],
['12 · OUTLINE','<p>Adds a dark border around bright areas to help sprites pop.</p>'],
['13 · EXPORT SIZE','<p>Pixel scale multiplies output dimensions on download.</p>'],
['14 · PIXEL GRID','<p>Shows guide lines in preview and in the exported PNG (≥3× scale).</p>'],
['15 · BEFORE / AFTER','<p>Compare the original and the pixel result side by side.</p>'],
['16 · RESTORE / RESET','<p>RESTORE shows the original in the main preview. RESET restores slider defaults.</p>'],
['17 · DOWNLOAD & TROUBLESHOOTING','<p>Both downloads are generated in the browser. If a download fails, check browser permissions; if the preview is too big, lower pixel size or scale.</p>']
],
de:[
['01 · ERSTE SCHRITTE','<p>Bild hochladen, Stil wählen, Regler anpassen, vergleichen, dann herunterladen.</p>'],
['02 · HOCHLADEN ODER ÄNDERN','<p>Klicken oder ziehen. Mit BILD ÄNDERN ersetzen. PNG, JPEG, WebP.</p>'],
['03 · FORMATE','<p>Eingabe: PNG, JPEG, WebP. Ausgabe: PNG. Animationen werden nicht als Animation verarbeitet.</p>'],
['04 · DATENSCHUTZ','<p>Alles im Browser. Nichts wird hochgeladen.</p>'],
['05 · PIXELGRÖSSE','<p>Kleinere Werte = größere Blöcke. Für Klassiker 48–96 px.</p>'],
['06 · PRESETS','<p>Fein, Klassisch, Grob, Sprite – Presets setzen Regler; Feinabstimmung bleibt möglich.</p>'],
['07 · SKALIERUNG','<p>Scharf = Nearest-Neighbor. Weich = gemischte Pixel.</p>'],
['08 · SCHÄRFE','<p>Verstärkt Kanten. Hohe Werte erzeugen Rauschen.</p>'],
['09 · UNSCHÄRFE','<p>Vor dem Verkleinern angewendet. Mehr Unschärfe = weicher.</p>'],
['10 · FARBANZAHL','<p>Begrenzt die Farben. Weniger = plakativ.</p>'],
['11 · KONTRAST & SÄTTIGUNG','<p>Kontrast trennt hell/dunkel. Sättigung steuert Farbintensität.</p>'],
['12 · KONTUR','<p>Dunkle Umrandung heller Bereiche, damit Sprites besser hervortreten.</p>'],
['13 · EXPORTGRÖSSE','<p>Pixel-Skalierung multipliziert die Exportabmessungen.</p>'],
['14 · PIXELRASTER','<p>Hilfslinien in Vorschau und PNG (ab 3× Skalierung).</p>'],
['15 · VORHER/NACHHER','<p>Original und Pixel-Ergebnis nebeneinander vergleichen.</p>'],
['16 · WIEDERHERSTELLEN/ZURÜCKSETZEN','<p>ORIGINAL zeigt das Original in der Hauptvorschau. RESET stellt Regler zurück.</p>'],
['17 · DOWNLOAD & HILFE','<p>Beide Downloads entstehen im Browser. Falls Download fehlschlägt, Berechtigungen prüfen; falls Vorschau zu groß, Pixelgröße oder Skalierung senken.</p>']
]};

/* ---------- state ---------- */
const $=s=>document.querySelector(s);
let lang=localStorage.getItem('mb-lang')||'en';
let img=null, showingOrig=false;
const cvs=$('#pc'), ctx=cvs.getContext('2d');

/* ---------- i18n ---------- */
function setLang(l){
  lang=l; document.documentElement.lang=l;
  document.title = l==='de'?'MakeBead — Pixel-Art-Studio':'MakeBead — Pixel Art Studio';
  document.querySelectorAll('[data-i]').forEach(el=>{
    const k=el.dataset.i;
    if(k==='HSPH'){el.placeholder=T[l][k];}
    else if(k==='HINTRO'){el.textContent=T[l].HINTRO;}
    else{el.textContent=T[l][k];}
  });
  $('#ea').textContent=T[l].EXA; $('#ca').textContent=T[l].COA;
  $('#hc').textContent=(l==='de'?'17 HILFETHEMEN':'17 HELP TOPICS');
  $('#he').textContent=T[l].EMPTY;
  renderHelp(); updateCaption();
  localStorage.setItem('mb-lang',l);
  $('#lang').value=l;
}
function renderHelp(filter=''){
  filter=filter.toLowerCase();
  const list=$('#helpList'); list.innerHTML='';
  let n=0;
  H[lang].forEach(([title,body])=>{
    if(filter && !(title+' '+body).toLowerCase().includes(filter)) return;
    n++;
    const d=document.createElement('details');
    d.innerHTML=`<summary>${title}</summary><div>${body}</div>`;
    list.appendChild(d);
  });
  $('#he').style.display=n?'none':'block';
}

/* ---------- converter ---------- */
function updateCaption(){
  if(!img){$('#cap').textContent='';return;}
  const w=+$('#ps').value, s=+$('#es').value, c=+$('#cl').value;
  $('#cap').textContent = T[lang].CAP.replace('{w}',w).replace('{h}',Math.round(w*img.height/img.width)).replace('{c}',c).replace('{s}',s);
}
function applyFilters(){
  const sh=+$('#sh').value, bl=+$('#bl').value, co=+$('#co').value, sa=+$('#sa').value;
  ctx.filter=`blur(${bl/25}px) contrast(${co}%) saturate(${sa}%)`;
}
function draw(){
  if(!img) return;
  const w=+$('#ps').value, h=Math.round(w*img.height/img.width);
  cvs.width=w; cvs.height=h;
  ctx.filter='none'; ctx.drawImage(img,0,0,w,h);
  applyFilters();
  if(+$('#bl').value){ctx.filter='none';}
  if(+$('#bl').value){
    const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
    const t=tmp.getContext('2d'); t.drawImage(img,0,0,w,h);
    t.filter=`blur(${$('#bl').value/25}px) contrast(${$('#co').value}%) saturate(${$('#sa').value}%)`;
    t.drawImage(img,0,0,w,h);
    ctx.clearRect(0,0,w,h); ctx.drawImage(tmp,0,0);
    ctx.filter='none';
  }
  // color limit (simple posterize)
  const lim=+$('#cl').value;
  if(lim<64){
    const d=ctx.getImageData(0,0,w,h), px=d.data, step=255/lim;
    for(let i=0;i<px.length;i+=4){
      px[i]=Math.round(px[i]/step)*step;
      px[i+1]=Math.round(px[i+1]/step)*step;
      px[i+2]=Math.round(px[i+2]/step)*step;
    }
    ctx.putImageData(d,0,0);
  }
  // outline
  if($('#ol').checked){
    const d=ctx.getImageData(0,0,w,h), src=new Uint8ClampedArray(d.data);
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
      const i=(y*w+x)*4;
      const bright=src[i]*.3+src[i+1]*.59+src[i+2]*.11;
      if(bright>128){
        const up=((y-1)*w+x)*4, dn=((y+1)*w+x)*4;
        const bu=src[up]*.3+src[up+1]*.59+src[up+2]*.11;
        if(bu<60){d.data[i]=d.data[i+1]=d.data[i+2]=0;}
      }
    }
    ctx.putImageData(d,0,0);
  }
  // scaling for display
  const scale=+$('#es').value;
  const disp=document.createElement('canvas'); disp.width=w*scale; disp.height=h*scale;
  const dc=disp.getContext('2d'); dc.imageSmoothingEnabled=$('#sm').value==='smooth';
  dc.drawImage(cvs,0,0,w*scale,h*scale);
  if($('#gr').checked && scale>=3){
    dc.strokeStyle='rgba(0,0,0,.15)'; dc.lineWidth=1;
    for(let x=0;x<=w;x++){dc.beginPath();dc.moveTo(x*scale,0);dc.lineTo(x*scale,h*scale);dc.stroke();}
    for(let y=0;y<=h;y++){dc.beginPath();dc.moveTo(0,y*scale);dc.lineTo(w*scale,y*scale);dc.stroke();}
  }
  // copy to visible canvas
  cvs.width=disp.width; cvs.height=disp.height;
  ctx.imageSmoothingEnabled=$('#sm').value==='smooth';
  ctx.drawImage(disp,0,0);
  // update compare
  const cp=$('#cp'), co=$('#co'), coCtx=co.getContext('2d');
  co.width=img.width; co.height=img.height; coCtx.drawImage(img,0,0);
  cp.width=disp.width; cp.height=disp.height;
  cp.getContext('2d').drawImage(disp,0,0);
  updateCaption();
}
function loadFile(f){
  if(!f || !/^image\/(png|jpeg|webp)$/.test(f.type)){alert(T[lang].BAD);return;}
  const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{img=i;showingOrig=false;$('#pv').classList.remove('hide');draw();};i.onerror=()=>alert(T[lang].FAIL);i.src=r.result;};
  r.readAsDataURL(f);
}
function download(cv,name){cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();});}

/* ---------- preset / controls ---------- */
const presets={
  fine:{ps:128,sh:30,bl:0,cl:32},
  classic:{ps:64,sh:25,bl:5,cl:24},
  chunky:{ps:32,sh:20,bl:10,cl:16},
  sprite:{ps:24,sh:15,bl:15,cl:12}
};
function applyPreset(p){const v=presets[p];$('#ps').value=v.ps;$('#psO').value=v.ps;$('#sh').value=v.sh;$('#shO').value=v.sh;$('#bl').value=v.bl;$('#blO').value=v.bl;$('#cl').value=v.cl;$('#clO').value=v.cl;draw();}
document.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>applyPreset(b.dataset.ps));

['ps','sh','bl','cl','co','sa','es'].forEach(id=>{
  const el=$('#'+id), out=$('#'+id+'O');
  el.oninput=()=>{out.value = id==='es'?el.value+'×':el.value; draw();};
});
$('#sm').onchange=draw; $('#ol').onchange=draw; $('#gr').onchange=draw;

/* ---------- buttons ---------- */
$('#drop').onclick=()=>$('#fi').click();
$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('h');};
$('#drop').ondragleave=()=>$('#drop').classList.remove('h');
$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('h');loadFile(e.dataTransfer.files[0]);};
$('#fi').onchange=e=>loadFile(e.target.files[0]);
$('#chg').onclick=()=>$('#fi').click();
$('#rst').onclick=()=>{if(!img)return alert(T[lang].NIMG);showingOrig=true;
  cvs.width=img.width;cvs.height=img.height;ctx.drawImage(img,0,0);
  $('#cap').textContent='Original';};
$('#rset').onclick=()=>{['ps','sh','bl','cl','co','sa','es'].forEach(id=>{
  const defs={ps:64,sh:25,bl:0,cl:24,co:100,sa:100,es:6};
  $('#'+id).value=defs[id]; $('#'+id+'O').value=id==='es'?defs[id]+'×':defs[id];
});draw();};
$('#dlp').onclick=()=>{if(!img)return alert(T[lang].NIMG);download(cvs,'pixel-art.png');};
$('#dlo').onclick=()=>{if(!img)return alert(T[lang].NIMG);
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  c.getContext('2d').drawImage(img,0,0);download(c,'original.png');};

/* ---------- tabs ---------- */
$('#tConv').onclick=()=>{$('#tConv').classList.add('on');$('#tComp').classList.remove('on');$('#pv').classList.remove('hide');$('#cv').classList.add('hide');};
$('#tComp').onclick=()=>{$('#tComp').classList.add('on');$('#tConv').classList.remove('on');$('#cv').classList.remove('hide');};

/* ---------- help modal ---------- */
const mb=$('#mb');
function openHelp(){mb.classList.add('on');renderHelp();$('#hs').focus();}
function closeHelp(){mb.classList.remove('on');}
$('#openHelp').onclick=openHelp; $('#olink').onclick=e=>{e.preventDefault();openHelp();};
$('#xHelp').onclick=closeHelp;
mb.onclick=e=>{if(e.target===mb)closeHelp();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHelp();});
$('#hs').oninput=e=>renderHelp(e.target.value);
$('#ea').onclick=()=>document.querySelectorAll('#helpList details').forEach(d=>d.open=true);
$('#ca').onclick=()=>document.querySelectorAll('#helpList details').forEach(d=>d.open=false);

/* ---------- language ---------- */
$('#lang').onchange=e=>setLang(e.target.value);
setLang(lang);
</script>
</body>
</html>
