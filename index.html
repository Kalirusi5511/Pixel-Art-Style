const $=s=>document.querySelector(s);let lang=localStorage.getItem('mb-lang')||'en';let img=null;const cvs=$('#pc'),ctx=cvs.getContext('2d');const DEF={ps:64,sh:25,bl:0,cl:24,co:100,sa:100,es:6};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400);}
function setLang(l){lang=l;document.documentElement.lang=l;document.title=l==='de'?'MakeBead — Pixel-Art-Studio':'MakeBead — Pixel Art Studio';document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i,v=T[l][k];if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){el.placeholder=v;}else{el.textContent=v;}});$('#hc').textContent=(l==='de'?'17 HILFETHEMEN':'17 HELP TOPICS');$('#he').textContent=T[l].EMPTY;renderHelp();updateCap();localStorage.setItem('mb-lang',l);$('#lang').value=l;}
function renderHelp(f=''){f=f.toLowerCase();const list=$('#helpList');list.innerHTML='';let n=0;H[lang].forEach(([t,b])=>{if(f&&!(t+' '+b).toLowerCase().includes(f))return;n++;const d=document.createElement('details');d.innerHTML=`<summary>${t}</summary><div>${b}</div>`;list.appendChild(d);});$('#he').style.display=n?'none':'block';}
function updateCap(){if(!img){$('#cap').textContent='';return;}const w=+$('#ps').value,s=+$('#es').value,c=+$('#cl').value;$('#cap').textContent=T[lang].CAP.replace('{w}',w).replace('{h}',Math.round(w*img.height/img.width)).replace('{c}',c).replace('{s}',s);}
function draw(){if(!img)return;const w=+$('#ps').value,h=Math.round(w*img.height/img.width);const bl=+$('#bl').value,co=+$('#co').value,sa=+$('#sa').value;const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;const t=tmp.getContext('2d');t.filter=`blur(${bl/25}px) contrast(${co}%) saturate(${sa}%)`;t.drawImage(img,0,0,w,h);cvs.width=w;cvs.height=h;ctx.filter='none';ctx.drawImage(tmp,0,0);const lim=+$('#cl').value;if(lim<64){const d=ctx.getImageData(0,0,w,h),px=d.data,st=255/lim;for(let i=0;i<px.length;i+=4){px[i]=Math.round(px[i]/st)*st;px[i+1]=Math.round(px[i+1]/st)*st;px[i+2]=Math.round(px[i+2]/st)*st;}ctx.putImageData(d,0,0);}if($('#ol').checked){const d=ctx.getImageData(0,0,w,h),s=new Uint8ClampedArray(d.data);const L=(x,y)=>{const i=(y*w+x)*4;return s[i]*.3+s[i+1]*.59+s[i+2]*.11;};for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++)if(L(x,y)>128&&Math.min(L(x-1,y),L(x+1,y),L(x,y-1),L(x,y+1))<60){const i=(y*w+x)*4;d.data[i]=d.data[i+1]=d.data[i+2]=0;}ctx.putImageData(d,0,0);}const sc=+$('#es').value,sm=$('#sm').value==='smooth';const disp=document.createElement('canvas');disp.width=w*sc;disp.height=h*sc;const dc=disp.getContext('2d');dc.imageSmoothingEnabled=sm;dc.drawImage(cvs,0,0,w*sc,h*sc);if($('#gr').checked&&sc>=3){dc.strokeStyle='rgba(0,0,0,.15)';dc.lineWidth=1;for(let x=0;x<=w;x++){dc.beginPath();dc.moveTo(x*sc,0);dc.lineTo(x*sc,h*sc);dc.stroke();}for(let y=0;y<=h;y++){dc.beginPath();dc.moveTo(0,y*sc);dc.lineTo(w*sc,y*sc);dc.stroke();}}cvs.width=disp.width;cvs.height=disp.height;cvs.style.imageRendering=sm?'auto':'pixelated';ctx.drawImage(disp,0,0);const cp=$('#cp'),co2=$('#co');co2.width=img.width;co2.height=img.height;co2.getContext('2d').drawImage(img,0,0);cp.width=disp.width;cp.height=disp.height;cp.getContext('2d').drawImage(disp,0,0);updateCap();}
function loadFile(f){if(!f||!/^image\/(png|jpeg|webp)$/.test(f.type)){toast(T[lang].BAD);return;}const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{img=i;$('#pv').classList.remove('hide');draw();};i.onerror=()=>toast(T[lang].FAIL);i.src=r.result;};r.readAsDataURL(f);}

const presets={fine:{ps:128,sh:30,bl:0,cl:32},classic:{ps:64,sh:25,bl:5,cl:24},chunky:{ps:32,sh:20,bl:10,cl:16},sprite:{ps:24,sh:15,bl:15,cl:12}};
document.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{const v=presets[b.dataset.ps];for(const k in v){$('#'+k).value=v[k];$('#'+k+'O').value=v[k];}draw();});
['ps','sh','bl','cl','co','sa','es'].forEach(id=>{const el=$('#'+id),o=$('#'+id+'O');el.oninput=()=>{o.value=id==='es'?el.value+'×':el.value;draw();};});

$('#drop').onclick=()=>$('#fi').click();$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('h');};$('#drop').ondragleave=()=>$('#drop').classList.remove('h');$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('h');loadFile(e.dataTransfer.files[0]);};$('#fi').onchange=e=>loadFile(e.target.files[0]);$('#chg').onclick=()=>$('#fi').click();

$('#rset').onclick=()=>{for(const k in DEF){$('#'+k).value=DEF[k];$('#'+k+'O').value=k==='es'?DEF[k]+'×':DEF[k];}$('#sm').value='sharp';$('#ol').checked=false;$('#gr').checked=false;draw();};
$('#dlp').onclick=()=>{if(!img)return toast(T[lang].NIMG);dl(cvs,'pixel-art.png');};
$('#dlo').onclick=()=>{if(!img)return toast(T[lang].NIMG);const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);dl(c,'original.png');};
$('#tConv').onclick=()=>{$('#tConv').classList.add('on');$('#tComp').classList.remove('on');$('#pv').classList.remove('hide');$('#cv').classList.add('hide');};
$('#tComp').onclick=()=>{$('#tComp').classList.add('on');$('#tConv').classList.remove('on');$('#cv').classList.remove('hide');};
const mb=$('#mb'),fbmb=$('#fbmb');
$('#openHelp').onclick=()=>{mb.classList.add('on');renderHelp();$('#hs').focus();};$('#olink').onclick=e=>{e.preventDefault();$('#openHelp').click();};$('#xHelp').onclick=()=>mb.classList.remove('on');mb.onclick=e=>{if(e.target===mb)mb.classList.remove('on');};$('#hs').oninput=e=>renderHelp(e.target.value);
$('#ea').onclick=()=>document.querySelectorAll('#helpList details').forEach(d=>d.open=true);$('#ca').onclick=()=>document.querySelectorAll('#helpList details').forEach(d=>d.open=false);
$('#fbLink').onclick=e=>{e.preventDefault();fbmb.classList.add('on');$('#fbMsg').textContent='';$('#fbText').focus();};$('#xfb').onclick=()=>fbmb.classList.remove('on');fbmb.onclick=e=>{if(e.target===fbmb)fbmb.classList.remove('on');};
$('#fbForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const form=e.target,msg=$('#fbMsg'),btn=$('#fbSend'),orig=btn.textContent;
  btn.textContent=lang==='de'?'SENDE...':'SENDING...';
  btn.disabled=true;msg.textContent='';
  try{
    const res=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}});
    if(res.ok){
      msg.style.color='green';
      msg.textContent=lang==='de'?'✓ Danke! Dein Feedback ist angekommen.':'✓ Thanks! Your feedback was sent.';
      form.reset();setTimeout(()=>fbmb.classList.remove('on'),2000);
    }else{
      const data=await res.json();
      msg.style.color='red';
      msg.textContent = 'Fehler: ' + (data.errors ? data.errors[0].message : 'Unbekannt');
    }
  }catch(err){
    msg.style.color='red';
    msg.textContent=lang==='de'?'✗ Netzwerkfehler. Bitte erneut versuchen.':'✗ Network error. Please try again.';
  }finally{
    btn.textContent=orig;btn.disabled=false;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){mb.classList.remove('on');fbmb.classList.remove('on');}});$('#lang').onchange=e=>setLang(e.target.value);setLang(lang);
</script></body></html>
